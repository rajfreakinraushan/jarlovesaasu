<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Page 1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      background-color: #ffe3e3;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      max-width: 400px;
    }

    h1 {
      font-size: 2em;
      color: #c92a2a;
      margin-bottom: 20px;
    }

    .btn {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .btn a {
      text-decoration: none;
      color: white;
      background-color: #d63384;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn a:hover {
      background-color: #ad2e6f;
    }

    img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="crying-sad.gif" alt="Sad Bear" />
    <h1>Aww 😢 Please say Yes!</h1>
    <div class="btn">
      <a href="yes.html">Okay 😳</a>
      <a href="no2.html">Still No</a>
    </div>
  </div>
</body>
</html>
